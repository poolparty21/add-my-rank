<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Page not found — Add My Rank</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4f46e5">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f6f7ff;
    color: #334155;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(560px, 100%);
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 18px 50px rgba(79, 70, 229, .12);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; font-weight: 800; }
  .mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #4f46e5, #c026d3); }
  h1 { margin: 26px 0 8px; font-size: 30px; line-height: 1.15; color: #0f172a; }
  p { margin: 0 0 24px; line-height: 1.65; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; padding: 11px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 14px; }
  .primary { background: #4f46e5; color: #fff; }
  .secondary { background: #eef2ff; color: #3730a3; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .14em; color: #64748b; }
</style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">▲</span>
      <span>Add My <span style="color:#4f46e5">Rank</span></span>
    </a>
    <p class="mono" style="margin-top:26px">404 · NOT FOUND</p>
    <h1>That page moved or never existed.</h1>
    <p>The screening and the report flow are still here. Start with your website address and get a real crawlability score.</p>
    <div class="actions">
      <a class="btn primary" href="/">Screen my site free</a>
      <a class="btn secondary" href="/boost">See the $7 boost</a>
    </div>
  </main>
  <script defer src="/analytics.js"></script>
</body>
</html>
